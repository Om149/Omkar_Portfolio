<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Projects')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main>
    <section class="page-banner">
        <div class="container">
            <h1>Projects</h1>
            <p>Analytics, web development and computer vision.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="project-list">
                <article class="card project" th:each="p : ${projects}">
                    <span class="tag" th:text="${p.category}">Category</span>
                    <h3 th:text="${p.title}">Title</h3>
                    <p class="muted" th:text="${p.summary}">Summary</p>
                    <ul class="bullets">
                        <li th:each="h : ${p.highlightList}" th:text="${h}">Highlight</li>
                    </ul>
                    <div class="chips">
                        <span class="chip" th:each="t : ${p.techList}" th:text="${t}">Tech</span>
                    </div>
                </article>
            </div>
            <p class="back">More code on <a th:href="${profile.github}" target="_blank" rel="noopener" class="link-arrow">my GitHub →</a></p>
            <p class="back"><a th:href="@{/}" class="link-arrow">← Back to home</a></p>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
