<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Messages')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main>
    <section class="page-banner">
        <div class="container">
            <h1>Inbox</h1>
            <p>Messages sent through the contact form.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <p class="muted" th:if="${#lists.isEmpty(messages)}">No messages yet.</p>
            <article class="card message" th:each="m : ${messages}">
                <div class="message-head">
                    <div>
                        <h3 th:text="${m.subject}">Subject</h3>
                        <p class="muted">
                            <span th:text="${m.name}">Name</span> ·
                            <a th:href="'mailto:' + ${m.email}" th:text="${m.email}">email</a> ·
                            <span th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy, HH:mm')}">date</span>
                        </p>
                    </div>
                    <form th:action="@{/admin/messages/{id}/delete(id=${m.id})}" method="post">
                        <button type="submit" class="btn btn-small btn-danger">Delete</button>
                    </form>
                </div>
                <p class="message-body" th:text="${m.message}">Body</p>
            </article>
            <p class="back"><a th:href="@{/}" class="link-arrow">← Back to home</a></p>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
