<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Education')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main>
    <section class="page-banner">
        <div class="container">
            <h1>Education &amp; certifications</h1>
            <p>Academic background and continued learning.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <h2 class="section-title">Education</h2>
            <div class="timeline">
                <article class="timeline-item" th:each="e : ${profile.education}">
                    <span class="timeline-date" th:text="${e.period()}">Period</span>
                    <h3 th:text="${e.degree()}">Degree</h3>
                    <p class="company" th:text="${e.institute()}">Institute</p>
                    <p class="muted" th:text="${e.score()}">Score</p>
                </article>
            </div>
        </div>
    </section>

    <section class="section alt">
        <div class="container">
            <h2 class="section-title">Certifications</h2>
            <div class="grid">
                <article class="card" th:each="c : ${profile.certifications}">
                    <div class="card-icon">🏅</div>
                    <h3 th:text="${c.title()}">Title</h3>
                    <p class="muted"><span th:text="${c.issuer()}">Issuer</span> · <span th:text="${c.date()}">Date</span></p>
                </article>
            </div>
            <p class="back"><a th:href="@{/}" class="link-arrow">← Back to home</a></p>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
