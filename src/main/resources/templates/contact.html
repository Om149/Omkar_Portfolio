<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contact')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main>
    <section class="page-banner">
        <div class="container">
            <h1>Contact</h1>
            <p>Have a question or an opportunity? Send me a message.</p>
        </div>
    </section>

    <section class="section">
        <div class="container two-col">
            <form th:action="@{/contact}" th:object="${contactMessage}" method="post" class="card form" novalidate>
                <div class="alert success" th:if="${success}" th:text="${success}"></div>

                <label for="name">Name</label>
                <input id="name" type="text" th:field="*{name}" maxlength="100" required>
                <small class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>

                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" maxlength="150" required>
                <small class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>

                <label for="subject">Subject</label>
                <input id="subject" type="text" th:field="*{subject}" maxlength="150" required>
                <small class="error" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></small>

                <label for="message">Message</label>
                <textarea id="message" th:field="*{message}" rows="6" maxlength="2000" required></textarea>
                <small class="error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></small>

                <button type="submit" class="btn">Send message</button>
            </form>

            <aside class="card">
                <h3>Direct contact</h3>
                <ul class="facts">
                    <li><strong>Email</strong> <a th:href="'mailto:' + ${profile.email}" th:text="${profile.email}"></a></li>
                    <li><strong>Phone</strong> <a th:href="'tel:' + ${profile.phone}" th:text="${profile.phone}"></a></li>
                    <li><strong>Location</strong> <span th:text="${profile.location}"></span></li>
                    <li><strong>LinkedIn</strong> <a th:href="${profile.linkedin}" target="_blank" rel="noopener">omkar-kadam</a></li>
                    <li><strong>GitHub</strong> <a th:href="${profile.github}" target="_blank" rel="noopener">Om149</a></li>
                </ul>
                <p class="back"><a th:href="@{/}" class="link-arrow">← Back to home</a></p>
            </aside>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
